name: Action Security Practice

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Security check
        run: |
          echo "Least-privilege permissions enabled"
          echo "Action version explicitly controlled"
          echo "Security check passed"
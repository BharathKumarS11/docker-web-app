name: Docker CI CD

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image tag
        id: tag
        run: |
          IMAGE_TAG="v1.0.${GITHUB_RUN_NUMBER}"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devops-web-app" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build -t "$IMAGE_NAME:${{ steps.tag.outputs.image_tag }}" .

      - name: Save image
        run: |
          docker save "$IMAGE_NAME:${{ steps.tag.outputs.image_tag }}" -o docker-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar

  test:
    name: Test Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          docker load -i docker-image.tar

      - name: Run container test
        run: |
          docker run -d --name test-container \
            -p 8080:80 \
            devops-web-app:v1.0.${GITHUB_RUN_NUMBER}

          sleep 5
          curl --fail http://localhost:8080

      - name: Cleanup
        if: always()
        run: |
          docker rm -f test-container || true

  push:
    name: Push Docker Image
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          docker load -i docker-image.tar

      - name: Set image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devops-web-app" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          docker tag \
            "devops-web-app:v1.0.${GITHUB_RUN_NUMBER}" \
            "$IMAGE_NAME:v1.0.${GITHUB_RUN_NUMBER}"

          docker push "$IMAGE_NAME:v1.0.${GITHUB_RUN_NUMBER}"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, test, push]
    environment: production

    steps:
      - name: Deploy
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devops-web-app"
          IMAGE_TAG="v1.0.${GITHUB_RUN_NUMBER}"

          echo "Deploying:"
          echo "$IMAGE_NAME:$IMAGE_TAG"
          echo "Deployment successful"
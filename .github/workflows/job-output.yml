name: Job Outputs Practice

on:
  push:
    branches:
      - main

jobs:

  build:
    name: Build Job
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.build_info.outputs.image_tag }}

    steps:
      - name: Create image tag
        id: build_info
        run: |
          IMAGE_TAG="v1.0.${{ github.run_number }}"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Show image tag
        run: |
          echo "Created image tag: ${{ steps.build_info.outputs.image_tag }}"


  test:
    name: Test Job
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Use build output
        run: |
          echo "Build job created:"
          echo "Image tag: ${{ needs.build.outputs.image_tag }}"
name: Test Report Practice

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create test report
        run: |
          mkdir -p test-results

          echo "Test Report" > test-results/report.txt
          echo "================" >> test-results/report.txt
          echo "Application: devops-web-app" >> test-results/report.txt
          echo "Test 1: PASS" >> test-results/report.txt
          echo "Test 2: PASS" >> test-results/report.txt
          echo "Test 3: FAIL" >> test-results/report.txt
          echo "Test execution completed" >> test-results/report.txt

      - name: Display test report
        run: |
          cat test-results/report.txt

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-results/report.txt